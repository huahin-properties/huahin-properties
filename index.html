document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e:'เก็งกำไร' },\n      { id:'k4', no:'04', date:'2026-06-08', pair:'BTC/USDT', buy:108200, qty:0.03, now:117400, note:'DCA' },\n      { id:'k5', no:'05', date:'2026-07-21', pair:'XRP/USDT', buy:2.42, qty:2500, now:3.08, note:'ถือยาว' },\n      { id:'k6', no:'06', date:'2026-08-14', pair:'BTC/USDT', buy:114900, qty:0.02, now:117400, note:'รอบสั้น' }\n    ],\n    cryptoSells: [],\n    trade: [\n      { id:'t1', no:'01', date:'2026-06-02', pair:'ADVANC', buy:268, qty:400, now:291, note:'ปันผล' },\n      { id:'t2', no:'02', date:'2026-07-15', pair:'PTT', buy:34.5, qty:5000, now:32.75, note:'ถือยาว' },\n      { id:'t3', no:'03', date:'2026-08-05', pair:'CPALL', buy:52.25, qty:2000, now:55.5, note:'รอบสั้น' }\n    ],\n    tradeSells: [],\n    notes: [\n      { id:'n1', date:'2026-08-22', name:'แผนสะสมทองเดือนหน้า', note:'รอย่อต่ำกว่า 70,500 แล้วเข้า 1 บาท' },\n      { id:'n2', date:'2026-08-18', name:'ปรับสัดส่วนพอร์ต', note:'คริปโตเกิน 20% ให้ทยอยลดเมื่อกำไรถึง 25%' }\n    ]\n  };\n\n  static SEED_IDS = ['L20260309-2120','L20260309-2121','L20260309-2125','L20260309-2127','L20260309-2129',\n    'L20260309-2131','L20260309-2133','L20260309-2135','L20260320-1130','L20260407-1422','L20260417-1218',\n    'L20260430-2011','L20260525-1004','L20260808-1612','L20260816-2117','L20260821-2232'];\n\n  applyingRemote = false;\n  bootDone = false;\n\n  static DATA_KEYS = ['goldSpot','refPrice','mktPrice','symbols','cash','gold','goldSells','crypto','trade','notes','cryptoSells','tradeSells'];\n\n  snapshot() {\n    const s = this.state, out = {};\n    this.constructor.DATA_KEYS.forEach(k => { out[k] = s[k] === undefined ? null : s[k]; });\n    out.updatedAt = s.updatedAt || 0;\n    out.updatedBy = s.deviceName || '';\n    return out;\n  }\n\n  httpMsg(code) {\n    if (code === 401 || code === 403) return 'ไม่มีสิทธิ์เข้าถึง — ตั้งค่า Rules ของ Realtime Database ให้อ่าน/เขียนได้';\n    if (code === 404) return 'ยังไม่ได้สร้าง Realtime Database หรือ URL ไม่ถูกต้อง';\n    return 'ข้อผิดพลาด HTTP ' + code;\n  }\n\n  syncEndpoint() {\n    let u = (this.state.syncUrl || FAMILY_DB || '').trim();\n    try {\n      const q = new URLSearchParams(location.search).get('db');\n      if (q) u = q;\n    } catch (e) {}\n    u = u.replace(/\\/+$/, '');\n    if (!u) return '';\n    return u + '/myPortfolio.json';\n  }\n\n  fmtTime(ts) {\n    if (!ts) return '';\n    const d = new Date(ts);\n    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');\n  }\n\n  async boot() {\n    const url = this.syncEndpoint();\n    if (!url) { this.bootDone = true; this.setState({ syncMode: 'offline', syncStatus: 'ออฟไลน์ — ยังไม่ได้ตั้งค่าฐานข้อมูล' }); return; }\n    this.setState({ syncMode: 'syncing', syncStatus: 'กำลังเชื่อมต่อ…' });\n    try {\n      const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });\n      if (!r.ok) throw new Error(this.httpMsg(r.status));\n      const d = await r.json();\n      const hasRemote = d && typeof d === 'object' && Array.isArray(d.gold);\n      if (hasRemote) {\n        const patch = { updatedAt: Number(d.updatedAt) || 0, updatedBy: d.updatedBy || '',\n          lastSync: Date.now(), syncMode: 'online', syncStatus: 'ออนไลน์' };\n        this.constructor.DATA_KEYS.forEach(k => { if (d[k] !== undefined && d[k] !== null) patch[k] = d[k]; });\n        this.applyingRemote = true;\n        this.setState(patch, () => { this.bootDone = true; this.lastSig = this.sig(); this.applyingRemote = false; });\n      } else {\n        this.bootDone = true;\n        await this.push(true);\n        this.setState({ syncMode: 'online', syncStatus: 'ออนไลน์ (สร้างข้อมูลชุดแรกแล้ว)' });\n      }\n    } catch (e) {\n      this.bootDone = true;\n      this.setState({ syncMode: 'error', syncStatus: 'เชื่อมต่อไม่สำเร็จ: ' + e.message });\n    }\n    this.startPolling();\n  }\n\n  sig() { return JSON.stringify(this.constructor.DATA_KEYS.map(k => this.state[k])); }\n\n  async pull(silent) {\n    const url = this.syncEndpoint();\n    if (!url) return;\n    if (!silent) this.setState({ syncMode: 'syncing', syncStatus: 'กำลังดึงข้อมูล…' });\n    try {\n      const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });\n      if (!r.ok) throw new Error(this.httpMsg(r.status));\n      const d = await r.json();\n      if (!d || typeof d !== 'object') { this.setState({ syncMode: 'online', syncStatus: 'ยังไม่มีข้อมูลบนคลาวด์' }); return; }\n      const remoteAt = Number(d.updatedAt) || 0;\n      if (remoteAt > (this.state.updatedAt || 0)) {\n        const patch = { updatedAt: remoteAt, updatedBy: d.updatedBy || '', syncMode: 'online',\n          syncStatus: 'รับข้อมูลใหม่จาก ' + (d.updatedBy || 'อีกเครื่อง'), lastSync: Date.now() };\n        this.constructor.DATA_KEYS.forEach(k => { if (d[k] !== undefined && d[k] !== null) patch[k] = d[k]; });\n        this.applyingRemote = true;\n        this.setState(patch, () => { this.lastSig = this.sig(); this.applyingRemote = false; });\n      } else {\n        this.setState({ syncMode: 'online', lastSync: Date.now(),\n          syncStatus: silent ? (this.state.syncStatus || 'ออนไลน์') : 'อัปเดตแล้ว' });\n      }\n    } catch (e) {\n      this.setState({ syncMode: 'error', syncStatus: 'ดึงข้อมูลไม่สำเร็จ: ' + e.message });\n    }\n  }\n\n  async push(silent) {\n    const url = this.syncEndpoint();\n    if (!url) return;\n    const stamp = Date.now();\n    const body = { ...this.snapshot(), updatedAt: stamp, updatedBy: this.state.deviceName || 'Jet' };\n    if (!silent) this.setState({ syncMode: 'syncing', syncStatus: 'กำลังส่งข้อมูล…' });\n    try {\n      const r = await fetch(url, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });\n      if (!r.ok) throw new Error(this.httpMsg(r.status));\n      this.setState({ updatedAt: stamp, updatedBy: body.updatedBy, lastSync: stamp,\n        syncMode: 'online', syncStatus: 'บันทึกขึ้นคลาวด์แล้ว' });\n    } catch (e) {\n      this.setState({ syncMode: 'error', syncStatus: 'ส่งข้อมูลไม่สำเร็จ: ' + e.message });\n    }\n  }\n\n  queuePush() {\n    if (!this.syncEndpoint() || this.applyingRemote || !this.bootDone) return;\n    clearTimeout(this.pushTimer);\n    this.pushTimer = setTimeout(() => this.push(true), 700);\n  }\n\n  startPolling() {\n    clearInterval(this.pollTimer);\n    if (!this.syncEndpoint()) return;\n    this.pollTimer = setInterval(() => { if (!this.pushTimer || this.bootDone) this.pull(true); }, 4000);\n  }\n\n  componentWillUnmount() {\n    clearInterval(this.pollTimer); clearTimeout(this.pushTimer);\n    if (this.onNet) { window.removeEventListener('online', this.onNet); window.removeEventListener('offline', this.onNet); }\n    if (this.onVis) document.removeEventListener('visibilitychange', this.onVis);\n  }\n\n  componentDidMount() {\n    try {\n      const cfg = JSON.parse(localStorage.getItem('portfolio_sync_cfg') || '{}');\n      if (cfg.syncUrl || cfg.deviceName) this.setState({ syncUrl: cfg.syncUrl || '', deviceName: cfg.deviceName || '' });\n    } catch (e) {}\n    try {\n      const raw = localStorage.getItem('portfolio_app_gold16b');\n      if (raw) {\n        const d = JSON.parse(raw) || {};\n        const seedIds = this.constructor.SEED_IDS;\n        const okGold = Array.isArray(d.gold) && d.gold.length >= 16\n          && d.gold.every(x => typeof x.remain === 'number' && !isNaN(x.remain))\n          && seedIds.every(id => d.gold.some(x => x.id === id));\n        if (d.dataVersion === '2026-08-22-gold16b' && okGold) {\n          const patch = {};\n          ['goldSpot','refPrice','mktPrice','symbols','cash','gold','goldSells','crypto','trade','notes','cryptoSells','tradeSells']\n            .forEach(k => { if (d[k] !== undefined) patch[k] = d[k]; });\n          this.setState(patch);\n        }\n      }\n    } catch (e) {}\n    setTimeout(() => this.boot(), 0);\n    this.onNet = () => { if (navigator.onLine) this.boot(); else this.setState({ syncMode: 'offline', syncStatus: 'ออฟไลน n\n  thDate(iso) { const [y,m,d] = iso.split('-').map(Number); return d + '/' + TH_M[m-1] + '/' + (y + 543); }\n\n  cat(key) {\n    const s = this.state;\n    if (key === 'cash' || key === 'cashPort') {\n      const arr = key === 'cashPort' ? s.cash.filter(x => this.isPort(x)) : s.cash;\n      return { cost: arr.reduce((a,x) => a + x.cost, 0), value: arr.reduce((a,x) => a + x.value, 0) };\n    }\n    if (key === 'gold') {\n      const act = s.gold.filter(x => x.remain > 0);\n      const cost = act.reduce((a,x) => a + this.lotCost(x), 0);\n      const w = act.reduce((a,x) => a + x.remain, 0);\n      return { cost, value: w * s.goldSpot, weight: w };\n    }\n    const arr = s[key];\n    const cost = arr.reduce((a,x) => a + x.buy * x.qty, 0) * (key === 'crypto' ? s.cryptoRate : 1);\n    const value = arr.reduce((a,x) => a + this.mkt(x) * x.qty, 0) * (key === 'crypto' ? s.cryptoRate : 1);\n    return { cost, value };\n  }\n\n  pnlOf(cost, value) {\n    const p = value - cost, pct = cost ? (p / cost) * 100 : 0;\n    return {\n      edge: p > 0.5 ? UP : (p < -0.5 ? DOWN : FLAT),\n      arrow: p > 0.5 ? '▲' : (p < -0.5 ? '▼' : '■'),\n      pct: (p >= 0 ? '' : '−') + Math.abs(pct).toFixed(2) + '%',\n      pnl: (p >= 0 ? '+' : '−') + nf(Math.abs(p))\n    };\n  }\n\n  setF(k) { return e => this.setState({ form: { ...this.state.form, [k]: e.target.value } }); }\n  num(k, d) { const v = this.state.form[k]; const n = parseFloat(String(v).replace(/,/g,'')); return isNaN(n) ? d : n; }\n\n  today() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }\n\n  nextNo(key) {\n    const arr = this.state[key] || [];\n    const max = arr.reduce((a,x) => Math.max(a, Number(x.no) || 0), 0);\n    return String(max + 1).padStart(2,'0');\n  }\n\n  openEdit(kind, item) {\n    let form = { ...(item || {}) };\n    if (!item) {\n      if (kind === 'gold') form = { no: this.nextNo('gold'), date: this.today(), unit = m.kind === 'crypto';\n    return { ...base, title: m.id ? 'แก้ไขรายการ ' + (f.pair || '') : (isC ? 'บันทึกซื้อคริปโต' : 'บันทึกซื้อหุ้น'),\n      sub: isC ? 'อัตราแลกเปลี่ยน ' + this.state.cryptoRate + ' บาท/USDT' : 'ตลาดหลักทรัพย์',\n      fields: [F('เลขที่ (อัตโนมัติ)','no','','text',true), F('วันที่','date','','date'), S(isC ? 'คู่เหรียญ' : 'ชื่อหุ้น','pair', this.symList(m.kind)),\n        F('ราคาซื้อ','buy','0','number'), F('จำนวน','qty','0','number'), F('ราคาปัจจุบัน (ใช้ร่วมทุกล็อต)','now','0','number'), F('หมายเหตุ','note','')] };\n  }\n\n  renderVals() {\n    const s = this.state, tab = s.tab;\n    const catsAll = { cash: this.cat('cash'), gold: this.cat('gold'), crypto: this.cat('crypto'), trade: this.cat('trade') };\n    const cats = { ...catsAll, cash: this.cat('cashPort') };\n    const totalCost = Object.values(cats).reduce((a,c) => a + c.cost, 0);\n    const totalValue = Object.values(cats).reduce((a,c) => a + c.value, 0);\n\n    let cost = totalCost, value = totalValue;\n    if (catsAll[tab]) { cost = catsAll[tab].cost; value = catsAll[tab].value; }\n    if (tab === 'cash') { const cp = this.cat('cashPort'); cost = cp.cost; value = cp.value; }\n    const realizedBy = {\n      gold: s.goldSells.reduce((a,x) => a + x.profit, 0),\n      crypto: (s.cryptoSells || []).reduce((a,x) => a + x.profit, 0),\n      trade: (s.tradeSells || []).reduce((a,x) => a + x.profit, 0), cash: 0\n    };\n    const realizedAll = realizedBy.gold + realizedBy.crypto + realizedBy.trade;\n    const realizedNow = cats[tab] ? realizedBy[tab] : realizedAll;\n    const netDiff = (value - cost) + realizedNow;\n    const hasData = catsAll[tab] ? (cost !== 0 || value !== 0 || realizedBy[tab] !== 0) : false;\n    const p = this.pnlOf(cost, cost + netDiff);\n\n    let acc = 0;\n    const segs = Object.keys(cats).map(k => {\n      const share = totalValue ? (cats[k].value / totalValue) * 100 : 0;\n      const from = acc; acc += share;\n      return { k, color: CAT_COLOR[k], from, to: acc, share: share.toFixed(0) + '%' };\n    });\n    const donut = 'conic-gradient(' + segs.map(x => x.color + ' ' + x.from.toFixed(1) + '% ' + x.to.toFixed(1) + '%').join(',') + ')';\n    const names = { cash: 'Cash', gold: 'Gold', crypto: 'Crypto', trade: 'Trade' };\n    const buckets = [];\n    const now = new Date();\n    for (let i = 5; i >= 0; i--) {\n      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);\n      buckets.push({ key: d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'),\n        label: TH_M[d.getMonth()], cost: 0, gain: 0 });\n    }\n    const bump = (date, field, amt) => {\n      const k = String(date || '').slice(0,7);\n      const b = buckets.find(x => x.key === k);\n      if (b) b[field] += amt;\n    };\n    s.gold.forEach(x => bump(x.date, 'cost', x.unit * x.w + x.fee));\n    s.goldSells.forEach(x => bump(x.date, 'gain', x.profit));\n    (s.crypto || []).forEach(x => bump(x.date, 'cost', x.buy * x.qty * s.cryptoRate));\n    (s.trade || []).forEach(x => bump(x.date, 'cost', x.buy * x.qty));\n    (s.cryptoSells || []).forEach(x => bump(x.date, 'gain', x.profit));\n    (s.tradeSells || []).forEach(x => bump(x.date, 'gain', x.profit));\n    const maxBar = Math.max(1, ...buckets.map(b => b.cost + Math.max(0, b.gain)));\n    const bars = buckets.map(b => ({ label: b.label,\n      costH: (b.cost / maxBar * 82).toFixed(0) + 'px',\n      gainH: (Math.max(0, b.gain) / maxBar * 82).toFixed(0) + 'px' }));\n    const hasBars = buckets.some(b => b.cost !== 0 || b.gain !== 0);\n\n    let rows = [], groups = [];\n    if (tab === 'home') {\n      rows = Object.keys(cats).filter(k => cats[k].cost !== 0 || cats[k].value !== 0 || realizedBy[k] !== 0).map(k => {\n        const c = cats[k];\n        const net = (c.value - c.cost) + realizedBy[k];\n        const q = this.pnlOf(c.cost, c.cost + net);\n        return { title: names[k], edge: q.edge, arrow: q.arrow, pct: q.pct,\n          l1: 'รวมต้นทุน', r1: nf(c.cost),\n          l2: 'รวมมูลค่าปัจจุบัน', r2: nf(c.value),\n          l3: 'กำไรที่ทำแล้ว ' + (realizedBy[k] >= 0 ? '+' : '−') + nf(Math.abs(realizedBy[k])) + ' · สัดส่วน ' + (totalValue ? (c.value / totalValue * 100).toFixed(1) : 0) + '%',\n          r3: (net >= 0 ? '+' : '−') + nf(Math.abs(net)),\n          onTap: () => this.setState({ tab: k }) };\n      });\n    } else if (tab === 'cash') {\n      const mk = (x, inp) => { const q = this.pnlOf(x.cost, x.value);\n        return { title: (inp ? '★ ' : '') + x.name, edge: inp ? '#0f8f4d' : '#7a6cc4',\n          bg: inp ? '#f2fbf5' : '#f8f7fd', arrow: q.arrow, pct: q.pct,\n          l1: x.note, r1: '', l2: 'รวมต้นทุน: ' + nf(x.cost), r2: 'มูลค่าปัจจุบัน: ' + nf(x.value),\n          l3: inp ? 'รวมในพอร์ตการลงทุน' : 'กระเป๋าส่วนตัว · ไม่รวมในพอร์ต',\n          r3: q.pnl, onTap: () => this.openEdit('cash', x) }; };\n      const portItems = s.cash.filter(x => this.isPort(x));\n      const ownItems = s.cash.filter(x => !this.isPort(x));\n      const sum = arr => arr.reduce((a,x) => a + x.value, 0);\n      const head = (title, sub, total, count, color, bg) => ({ title, edge: color, bg, arrow: '', pct: '',\n        frameTop: true, frameColor: color,\n        l1: sub, r1: '', l2: count + ' รายการ', r2: 'รวมทั้งสิ้น: ' + nf(total), l3: '', r3: '', onTap: () => {} });\n      rows = [];\n      groups = [\n        { title: 'กลุ่ม 1 · Cash Flow เพื่อการลงทุน', sub: 'รวมเป็นทุนและมูลค่าพอร์ต',\n          total: nf(sum(portItems)), count: portItems.length, color: '#0f8f4d', bg: '#f2fbf5',\n          items: portItems.map(x => mk(x, true)) },\n        { title: 'กลุ่ม 2 · รายจ่ายและเงินสำรอง', sub: 'กระเป๋าส่วนตัว · ไม่เกี่ยวกับพอร์ต',\n          total: nf(sum(ownItems)), count: ownItems.length, color: '#7a6cc4', bg: '#f8f7fd',\n          items: ownItems.map(x => mk(x, false)) }\n      ];\n      void head;\n    } else if (tab === 'gold') {\n      if (s.goldView === 'sold') {\n        rows = s.goldSells.slice().reverse().map(x => {\n          const q = this.pnlOf(x.cost * x.qty, x.price * x.qty);\n          return { title: 'ขายล็อตที่ ' + Number(x.no), edge: q.edge, arrow: q.arrow, pct: q.pct,\n            l1: this.thDate(x.date) + ' | ' + x.note, r1: '',\n            l2: 'ขายบาทละ: ' + nf(x.price), r2: 'จำนวน: ' + wf(x.qty) + ' บาท',\n            l3: 'ทุน/บาท: ' + nf(x.cost) + '  ·  ' + x.lotId, r3: (x.profit >= 0 ? '+' : '−') + nf(Math.abs(x.profit)),\n            onTap: () => this.openEdit('goldsell', x) }; });\n      } else {\n        const list = s.goldView === 'all' ? s.gold : s.gold.filter(x => x.remain > 0);\n        rows = list.slice().reverse().map(x => {\n          const active = x.remain > 0;\n          const c = active ? this.lotCost(x) : x.unit * x.w + x.fee;\n          const v = active ? x.remain * s.goldSpot : 0;\n          const q = active ? this.pnlOf(c, v) : { edge: FLAT, arrow: '■', pct: 'ขายหมด', pnl: '—' };\n          return { title: 'ล็อตที่ ' + Number(x.no), edge: q.edge, arrow: q.arrow, pct: q.pct,\n            l1: this.thDate(x.date) + ' | ' + x.note, r1: '',\n            l2: 'ทุนรวม: ' + nf(c), r2: active ? 'มูลค่าวันนี้: ' + nf(v) : x.id,\n            l3: 'ทุน/บาท: ' + nf(x.unit) + '   เหลือ: ' + (active ? x.remain.toFixed(2) : '0.00') + ' บาท',\n            r3: active ? q.pnl : '—',\n            onTap: () => this.openEdit('gold', x) }; });\n      }\n    } else if (tab === 'note') {\n      rows = s.notes.map(x => ({ title: x.name, edge: FLAT, arrow: '✎', pct: '', l1: this.thDate(x.date), r1: '',\n        l2: x.note, r2: '', l3: '', r3: '', onTap: () => this.openEdit('note', x) }));\n    } else {\n      const rate = tab === 'crypto' ? s.cryptoRate : 1;\n      rows = s[tab].slice().reverse().map(x => {\n        const px = this.mkt(x);\n        const c = x.buy * x.qty * rate, v = px * x.qty * rate, q = this.pnlOf(c, v);\n        return { title: 'No. ' + Number(x.no) + '  ' + x.pair, edge: q.edge, arrow: q.arrow, pct: q.pct,\n          l1: this.thDate(x.date) + ' | ' + x.note, r1: '',\n          l2: 'ราคาซื้อ: ' + x.buy + '  จำนวน: ' + x.qty, r2: 'ราคาปัจจุบัน: ' + px,\n          l3: 'รวมต้นทุน: ' + nf(c) + '   มูลค่า: ' + nf(v), r3: q.pnl,\n          onTap: () => this.openEdit(tab, x) }; });\n    }\n\n    let symPrices = [];\n    if (tab === 'crypto' || tab === 'trade') {\n      const rate = tab === 'crypto' ? s.cryptoRate : 1;\n      const pairs = this.symList(tab);\n      symPrices = pairs.map(pair => {\n        const lots = s[tab].filter(x => x.pair === pair);\n        const qty = lots.reduce((a,x) => a + x.qty, 0);\n        const cst = lots.reduce((a,x) => a + x.buy * x.qty, 0) * rate;\n        const px = lots.length ? this.mkt(lots[0]) : ((s.mktPrice || {})[pair] || 0);\n        const val = px * qty * rate;\n        const q = this.pnlOf(cst, val);\n        return { pair, value: String(px), pnl: q.pnl, color: q.edge,\n          onInput: e => { const n = parseFloat(String(e.target.value).replace(/,/g,'')); if (!isNaN(n)) this.setMkt(pair, n); } };\n      });\n    }\n    const priceKey = { gold: s.goldSpot, crypto: s.refPrice.crypto, trade: s.refPrice.trade };\n    const goldSoldW = s.goldSells.reduce((a,x) => a + x.qty, 0);\n    const goldRealized = s.goldSells.reduce((a,x) => a + x.profit, 0);\n    const held = { gold: wf(cats.gold.weight || 0) + ' บาท', crypto: s.crypto.length + ' รายการ', trade: s.trade.length + ' รายการ' };\n    const soldTxt = { gold: wf(goldSoldW) + ' บาท',\n      crypto: (s.cryptoSells || []).length + ' รายการ', trade: (s.tradeSells || []).length + ' รายการ' };\n    const realized = { gold: goldRealized, crypto: realizedBy.crypto, trade: realizedBy.trade };\n    const soldCnt = { crypto: (s.cryptoSells || []).length, trade: (s.tradeSells || []).length };\n    const subs = { home: 'ภาพรวมพอร์ตทั้งหมด', cash: 'เงินสดและเงินสำรอง', gold: 'ทองคำแท่ง / รูปพรรณ',\n      crypto: 'สินทรัพย์ดิจิทัล', trade: 'หุ้นและกองทุน', note: 'บันทึกช่วยจำ' };\n\n    return {\n      hdrTitle: tab === 'home' ? 'Home' : (tab === 'note' ? 'Note' : names[tab] || 'Trade'),\n      hdrSub: subs[tab], hdrBg: HDR[tab],\n      showGrand: tab === 'home',\n      costWord: tab === 'home' ? 'ลงทุน' : 'ทุน',\n      grandFmt: nf(totalValue + (catsAll.cash.value - cats.cash.value)),\n      costFmt: nf(cost), valueFmt: nf(value), pctFmt: p.pct, pnlColor: p.edge, pnlArrow: p.arrow,\n      netDiffFmt: (netDiff >= 0 ? '+' : '−') + nf(Math.abs(netDiff)),\n      netDiffColor: netDiff > 0.5 ? UP : (netDiff < -0.5 ? DOWN : FLAT),\n      netCalc: '(' + nf(value) + ' − ' + nf(cost) + ') + ' + nf(realizedNow) + ' =',\n      showNetDiff: hasData,\n      netScope: cats[tab] ? ' · ' + (names[tab] || '') : '',\n      showCharts: tab === 'home' && hasBars,\n      showTrade: tab === 'gold' || tab === 'crypto' || tab === 'trade',\n      canAdd: tab === 'cash' || tab === 'note' || tab === 'gold' || tab === 'crypto' || tab === 'trade',\n      addLabel: tab === 'gold' ? (s.goldView === 'sold' ? '＋ บันทึกการขาย' : '＋ บันทึกซื้อทอง') : '＋ เพิ่มรายการ',\n      showGoldTabs: tab === 'gold',\n      goldTabs: [['active','คงเหลือ ' + s.gold.filter(x => x.remain > 0).length],['all','ทั้งหมด ' + s.gold.length],['sold','ขายแล้ว ' + s.goldSells.length]]\n        .map(([k, label]) => ({ label, bg: s.goldView === k ? '#141821' : '#fff', fg: s.goldView === k ? '#fff' : '#5d6373',\n          onClick: () => this.setState({ goldView: k }) })),\n      donut, bars, hasBars,\n      emptyMsg: rows.length === 0 ? 'ยังไม่มีรายการในหมวดนี้' : '',\n      isEmpty: rows.length === 0 && groups.length === 0,\n      groups,\n      legend: segs.filter(x => cats[x.k].value !== 0).map(x => ({ name: names[x.k], color: x.color, share: x.share })),\n      priceVal: String(priceKey[tab] || ''),\n      priceHint: 'ราคาทองวันนี้',\n      showSpotInput: tab === 'gold',\n      hasSymPrices: (tab === 'crypto' || tab === 'trade') && symPrices.length > 0,\n      symPrices,\n      canAddSymbol: tab === 'crypto' || tab === 'trade',\n      symbolWord: tab === 'crypto' ? 'คู่เหรียญ' : 'ชื่อหุ้น',\n      openSymbol: () => this.setState({ modal: { kind: 'symbol', symKind: tab, id: null }, form: {} }),\n      setPrice: e => {\n        const n = parseFloat(String(e.target.value).replace(/,/g,''));\n        if (!isNaN(n) && tab === 'gold') this.setState({ goldSpot: n });\n      },\n      heldLabel: tab === 'gold' ? 'ทองที่มี' : 'ถืออยู่',\n      heldFmt: held[tab] || '—', soldFmt: soldTxt[tab] || '—',\n      realizedFmt: ((realized[tab] || 0) >= 0 ? '+' : '−') + nf(Math.abs(realized[tab] || 0)),\n      realizedColor: (realized[tab] || 0) > 0.5 ? UP : ((realized[tab] || 0) < -0.5 ? DOWN : FLAT),\n      openBuy: () => this.openEdit(tab === 'note' ? 'note' : (tab === 'gold' && s.goldView === 'sold' ? 'goldsell' : tab), null),\n      openSell: () => {\n        if (tab === 'gold') {\n          const act = s.gold.filter(x => x.remain > 0);\n          if (act.length) this.setState({ modal: { kind: 'sell', sellKind: 'gold', id: act[act.length-1].id }, form: { date: this.today() } });\n          return;\n        }\n        const arr = s[tab];\n        if (arr && arr.length) this.setState({ modal: { kind: 'sell', sellKind: tab, id: arr[arr.length-1].id }, form: { date: this.today() } });\n      },\n      openNote: () => this.setState({ tab: 'note', modal: null }),\n      doRefresh: () => { if (this.syncEndpoint()) this.pull(false); else this.setState({ syncStatus: 'ยังไม่ได้ตั้งค่าฐานข้อมูลครอบครัว' }); },\n      openSync: () => this.setState({ modal: { kind: 'sync', id: null },\n        form: { syncUrl: this.state.syncUrl || '', deviceName: this.state.deviceName || '' } }),\n      syncOn: !!this.syncEndpoint(),\n      syncDot: { online: '#4ade80', syncing: '#fbbf24', offline: 'rgba(255,255,255,.45)', error: '#fb7185' }[this.state.syncMode] || 'rgba(255,255,255,.45)',\n      syncLabel: { online: 'ออนไลน์', syncing: 'กำลังซิงก์', offline: 'ออฟไลน์', error: 'ซิงก์ผิดพลาด' }[this.state.syncMode] || 'ออฟไลน์',\n      syncMeta: this.state.lastSync\n        ? 'อัปเดตล่าสุด ' + this.fmtTime(this.state.lastSync) + ' โดย ' + (this.state.updatedBy || this.state.deviceName || 'Jet')\n        : '',\n      closeModal: () => this.setState({ modal: null, confirmDel: false }),\n      modal: this.modalVals(),\n      confirmReset: !!this.state.confirmReset,\n      cancelReset: () => this.setState({ confirmReset: false }),\n      doReset: () => {\n        try {\n          ['portfolio_app_v1','portfolio_app_v2','portfolio_app_gold16','portfolio_app_gold16b']\n            .forEach(k => localStorage.removeItem(k));\n        } catch (e) {}\n        this.setState({ confirmReset: false });\n        if (this.syncEndpoint()) this.boot();\n        else location.reload();\n      },\n      confirmDel: !!this.state.confirmDel,\n      confirmDelLabel: this.delLabel(),\n      doDelete: () => this.del(),\n      cancelDelete: () => this.setState({ confirmDel: false }),\n      rows: rows.map(r => ({ ...r, bg: r.bg || '#fff',\n        frameStyle: r.frameTop\n          ? 'border:2px solid ' + r.frameColor + ';border-radius:12px;margin-top:6px'\n          : 'border:1px solid #e6e8ef;border-radius:9px;margin-left:10px' })),\n      nav: [['home','◈','Home'],['cash','฿','Cash'],['gold','◆','Gold'],['crypto','₿','Crypto'],['trade','▤','Trade']]\n        .map(([k, icon, label]) => ({ icon, label, op: tab === k ? '1' : '.6',\n          dot: tab === k ? '#fff' : 'transparent', onClick: () => this.setState({ tab: k, modal: null }) }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
